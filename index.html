<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Floral View - 互動夢幻花海</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #060913;
            color: #f1f5f9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
        }

        .glass-panel {
            background: rgba(13, 19, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .glass-pill {
            background: rgba(26, 36, 56, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glow-text {
            text-shadow: 0 0 14px rgba(244, 114, 182, 0.6), 0 0 28px rgba(168, 85, 247, 0.4);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.7);
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden select-none">

    <!-- Interactive Background Canvas -->
    <canvas id="flowerCanvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

    <!-- Top Navigation Header -->
    <header class="relative z-10 w-full p-4 sm:p-6 flex items-center justify-between pointer-events-none">
        <!-- Title & Info -->
        <div class="flex items-center gap-3.5 pointer-events-auto">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-pink-500/30 border border-white/20">
                <i class="fa-solid fa-seedling text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg sm:text-xl tracking-wide bg-gradient-to-r from-pink-300 via-purple-200 to-indigo-200 bg-clip-text text-transparent glow-text">
                    Dynamic Floral View
                </h1>
                <p class="text-xs text-slate-400 font-medium hidden sm:flex items-center gap-2">
                    <span>軌跡感應生長</span>
                    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                    <span>多節點關節風場</span>
                    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                    <span id="activeCountDisplay" class="text-pink-400">0 朵盛開中</span>
                </p>
            </div>
        </div>

        <!-- Header Controls -->
        <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
            <button id="soundBtn" onclick="toggleAudio()" class="glass-pill px-3.5 py-2.5 rounded-xl hover:bg-slate-700/60 text-slate-200 transition flex items-center gap-2 text-xs font-semibold">
                <i id="soundIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
                <span class="hidden md:inline" id="soundText">音效已關閉</span>
            </button>

            <button onclick="takeSnapshot()" class="glass-pill px-3.5 py-2.5 rounded-xl hover:bg-slate-700/60 text-slate-200 transition flex items-center gap-2 text-xs font-semibold" title="儲存畫面畫作">
                <i class="fa-solid fa-camera text-pink-400"></i>
                <span class="hidden md:inline">擷取畫作</span>
            </button>

            <button onclick="toggleSidebar()" class="glass-pill p-2.5 rounded-xl hover:bg-slate-700/60 text-slate-200 transition text-sm flex items-center justify-center" title="控制控制面板">
                <i class="fa-solid fa-sliders text-indigo-400 text-base"></i>
            </button>
        </div>
    </header>

    <!-- Center Interactive Hint Toast -->
    <div id="interactionHint" class="relative z-10 mx-auto mb-5 pointer-events-none transition-all duration-700 transform translate-y-0 opacity-100">
        <div class="glass-pill px-5 py-2.5 rounded-full flex items-center gap-3 text-xs sm:text-sm font-medium text-slate-200 shadow-2xl border border-pink-500/30">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-pink-500"></span>
            </span>
            <span>滑鼠劃過螢幕：播種生長與微風搖曳</span>
            <span class="text-slate-400 text-xs hidden sm:inline">| 長按拖曳爆發盛開</span>
        </div>
    </div>

    <!-- Right Control Panel Drawer -->
    <aside id="sidebarPanel" class="fixed top-20 right-4 sm:right-6 z-30 w-80 max-h-[calc(100vh-120px)] glass-panel rounded-3xl p-5 flex flex-col gap-5 border border-white/10 transition-all duration-500 transform translate-x-[360px] opacity-0 pointer-events-none overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
            <div class="flex items-center gap-2 font-bold text-sm text-slate-200">
                <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i>
                <span>花園花卉與動作設定</span>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-200 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Flower Variety Selection -->
        <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-300 flex justify-between">
                <span>花卉品種主題</span>
                <span id="selectedVarietyName" class="text-pink-400 font-mono">櫻花浪漫</span>
            </label>
            <div class="grid grid-cols-2 gap-2" id="flowerVarietyContainer">
                <!-- Dynamically generated preset buttons -->
            </div>
        </div>

        <!-- Interaction Mode Selection -->
        <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-300">軌跡互動模式</label>
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-900/80 rounded-2xl border border-slate-800 text-xs">
                <button id="modePlantBtn" onclick="setInteractionMode('plant')" class="py-2 px-1 rounded-xl font-medium transition bg-pink-600 text-white shadow-md flex items-center justify-center gap-1">
                    <span>🌱</span> 播種成長
                </button>
                <button id="modeBreezeBtn" onclick="setInteractionMode('breeze')" class="py-2 px-1 rounded-xl font-medium transition text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1">
                    <span>💨</span> 靈動風場
                </button>
                <button id="modeSunBtn" onclick="setInteractionMode('sunlight')" class="py-2 px-1 rounded-xl font-medium transition text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1">
                    <span>✨</span> 陽光綻放
                </button>
                <button id="modeVortexBtn" onclick="setInteractionMode('vortex')" class="py-2 px-1 rounded-xl font-medium transition text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1">
                    <span>🌀</span> 花瓣漩渦
                </button>
            </div>
        </div>

        <!-- Sliders -->
        <div class="space-y-4 pt-1">
            <div>
                <div class="flex justify-between items-center text-xs font-semibold text-slate-300 mb-1.5">
                    <span>花朵尺寸規模</span>
                    <span id="scaleValText" class="text-indigo-400 font-mono">1.0x</span>
                </div>
                <input id="scaleSlider" type="range" min="0.5" max="2.2" step="0.1" value="1.0" oninput="updateControls()" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>

            <div>
                <div class="flex justify-between items-center text-xs font-semibold text-slate-300 mb-1.5">
                    <span>搖曳風力感應</span>
                    <span id="windValText" class="text-indigo-400 font-mono">高 (1.4)</span>
                </div>
                <input id="windSlider" type="range" min="0.2" max="3.0" step="0.2" value="1.4" oninput="updateControls()" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            </div>

            <div>
                <div class="flex justify-between items-center text-xs font-semibold text-slate-300 mb-1.5">
                    <span>飄落花瓣與花粉密度</span>
                    <span id="pollenValText" class="text-indigo-400 font-mono">豐富</span>
                </div>
                <input id="pollenSlider" type="range" min="0" max="2" step="1" value="1" oninput="updateControls()" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="pt-3 border-t border-slate-700/60 flex items-center gap-2">
            <button onclick="clearGarden()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-900/40 border border-slate-700 text-xs font-semibold text-rose-300 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-trash-can"></i> 清空花園
            </button>
            <button onclick="triggerBloomBurst()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-xs font-bold text-white shadow-lg shadow-pink-500/25 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 滿園綻放
            </button>
        </div>
    </aside>

    <script>
        // Flower Variety Preset Configurations
        const FLOWER_VARIETIES = {
            sakura: {
                id: 'sakura',
                name: '櫻花浪漫',
                icon: '🌸',
                petals: 5,
                petalColors: ['#fbcfe8', '#f472b6', '#ec4899', '#fda4af'],
                centerColor: '#fef08a',
                stemColor: '#3f6212',
                leafColor: '#65a30d',
                petalShape: 'heart',
                pollenColor: 'rgba(251, 207, 232, 0.85)'
            },
            cyberNeon: {
                id: 'cyberNeon',
                name: '極光霓虹',
                icon: '🌺',
                petals: 8,
                petalColors: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6'],
                centerColor: '#38bdf8',
                stemColor: '#0284c7',
                leafColor: '#06b6d4',
                petalShape: 'pointed',
                pollenColor: 'rgba(56, 189, 248, 0.9)'
            },
            sunflower: {
                id: 'sunflower',
                name: '璀璨向日葵',
                icon: '🌻',
                petals: 16,
                petalColors: ['#fde047', '#facc15', '#fbbf24', '#f59e0b'],
                centerColor: '#78350f',
                stemColor: '#15803d',
                leafColor: '#22c55e',
                petalShape: 'ray',
                pollenColor: 'rgba(253, 224, 71, 0.85)'
            },
            etherealLotus: {
                id: 'etherealLotus',
                name: '雙色幻彩蓮',
                icon: '🪷',
                petals: 12,
                petalColors: ['#a855f7', '#d8b4fe', '#f43f5e', '#fecdd3'],
                centerColor: '#fef08a',
                stemColor: '#047857',
                leafColor: '#10b981',
                petalShape: 'layered',
                pollenColor: 'rgba(216, 180, 254, 0.85)'
            },
            fractalRose: {
                id: 'fractalRose',
                name: '暗夜紫羅蘭',
                icon: '🌹',
                petals: 7,
                petalColors: ['#c084fc', '#a855f7', '#7e22ce', '#e879f9'],
                centerColor: '#fde047',
                stemColor: '#4c1d95',
                leafColor: '#6b21a8',
                petalShape: 'rounded',
                pollenColor: 'rgba(192, 132, 252, 0.85)'
            }
        };

        // Global State
        let canvas, ctx;
        let width, height;
        let currentVariety = FLOWER_VARIETIES.sakura;
        let interactionMode = 'plant'; // 'plant', 'breeze', 'sunlight', 'vortex'
        let globalScale = 1.0;
        let windFactor = 1.4;
        let pollenDensityLevel = 1;

        // Collections
        let flowers = [];
        let particles = [];
        let mouseTrail = [];

        // Mouse Tracker
        let mouse = { x: -1000, y: -1000, lastX: -1000, lastY: -1000, vx: 0, vy: 0, isDown: false, active: false };

        // Audio System
        let audioCtx = null;
        let soundEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
        }

        function playChimeSound(pitchFreq = 523.25) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitchFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitchFreq * 1.6, audioCtx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.error(e);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');

            if (soundEnabled) {
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                icon.className = 'fa-solid fa-volume-high text-pink-400';
                text.innerText = '音效已開啟';
                playChimeSound(659.25);
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '音效已關閉';
            }
        }

        // Multi-segment dynamic spring stem Flower class
        class MultiJointFlower {
            constructor(x, y, variety, options = {}) {
                this.x = x;
                this.y = y;
                this.variety = variety;
                this.targetHeight = options.targetHeight || (100 + Math.random() * 140) * globalScale;
                this.currentStemLength = 0;
                this.stemGrowthSpeed = (3.0 + Math.random() * 2.5);

                this.maxRadius = (22 + Math.random() * 26) * globalScale;
                this.currentRadius = 0;
                this.bloomProgress = 0;

                // Multi-joint Stem Physics (4 joints for organic physics bend)
                this.segmentCount = 4;
                this.joints = [];
                for (let i = 0; i <= this.segmentCount; i++) {
                    this.joints.push({
                        x: x,
                        y: y,
                        vx: 0,
                        vy: 0,
                        offsetX: 0
                    });
                }

                this.stiffness = 0.08;
                this.damping = 0.86;

                this.petals = variety.petals;
                this.colorPalette = variety.petalColors;
                this.primaryColor = this.colorPalette[Math.floor(Math.random() * this.colorPalette.length)];
                this.secondaryColor = this.colorPalette[Math.floor(Math.random() * this.colorPalette.length)];

                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.008;

                this.leaves = [
                    { t: 0.3, side: -1, size: (12 + Math.random() * 8) * globalScale },
                    { t: 0.6, side: 1, size: (14 + Math.random() * 8) * globalScale }
                ];

                this.isFullyGrown = false;
                this.pollenSpawnTimer = 0;
            }

            update(mouseObj, globalWindX) {
                // Grow stem height
                if (this.currentStemLength < this.targetHeight) {
                    this.currentStemLength += this.stemGrowthSpeed;
                } else {
                    // Bloom head
                    if (this.bloomProgress < 1) {
                        this.bloomProgress += 0.035;
                        this.currentRadius = this.maxRadius * Math.sin(this.bloomProgress * Math.PI / 2);
                        if (this.bloomProgress >= 1 && !this.isFullyGrown) {
                            this.isFullyGrown = true;
                            playChimeSound(450 + Math.random() * 400);
                        }
                    }
                }

                // Update Joint positions along height
                const segLen = this.currentStemLength / this.segmentCount;
                this.joints[0].x = this.x;
                this.joints[0].y = this.y;

                // Physics simulation per joint
                for (let i = 1; i <= this.segmentCount; i++) {
                    const joint = this.joints[i];
                    const prevJoint = this.joints[i - 1];

                    // Rest position calculation
                    const targetX = prevJoint.x;
                    const targetY = prevJoint.y - segLen;

                    // Spring force towards rest position
                    const dx = targetX - joint.x;
                    joint.vx += dx * this.stiffness;
                    joint.vx += globalWindX * (i / this.segmentCount) * 0.3 * windFactor;

                    // Mouse proximity trajectory force
                    const distToMouse = Math.hypot(joint.x - mouseObj.x, joint.y - mouseObj.y);
                    if (distToMouse < 140) {
                        const force = (1 - distToMouse / 140) * mouseObj.vx * 0.15 * windFactor * (i / this.segmentCount);
                        joint.vx += force;

                        if (interactionMode === 'vortex') {
                            const angle = Math.atan2(mouseObj.y - joint.y, mouseObj.x - joint.x);
                            joint.vx += Math.cos(angle + Math.PI / 2) * 2;
                        }
                    }

                    joint.vx *= this.damping;
                    joint.x += joint.vx;
                    joint.y = targetY; // Keep vertical spacing fixed
                }

                this.rotation += this.rotationSpeed;

                // Emit pollen particles
                if (this.bloomProgress > 0.4 && pollenDensityLevel > 0) {
                    this.pollenSpawnTimer++;
                    const interval = pollenDensityLevel === 2 ? 12 : 28;
                    if (this.pollenSpawnTimer % interval === 0) {
                        const tip = this.getTipPosition();
                        particles.push(new PetalParticle(
                            tip.x + (Math.random() - 0.5) * this.currentRadius,
                            tip.y + (Math.random() - 0.5) * this.currentRadius,
                            this.variety.pollenColor,
                            Math.random() > 0.5 ? 'pollen' : 'petal',
                            this.primaryColor
                        ));
                    }
                }
            }

            getTipPosition() {
                const tip = this.joints[this.segmentCount];
                return { x: tip.x, y: tip.y };
            }

            draw(ctx) {
                // Draw Curved Stem through joints
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.joints[0].x, this.joints[0].y);

                for (let i = 1; i < this.segmentCount; i++) {
                    const xc = (this.joints[i].x + this.joints[i + 1].x) / 2;
                    const yc = (this.joints[i].y + this.joints[i + 1].y) / 2;
                    ctx.quadraticCurveTo(this.joints[i].x, this.joints[i].y, xc, yc);
                }
                const tip = this.getTipPosition();
                ctx.lineTo(tip.x, tip.y);

                ctx.strokeStyle = this.variety.stemColor;
                ctx.lineWidth = Math.max(1.8, 4.8 * globalScale * (this.currentStemLength / this.targetHeight));
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Draw Leaves on stem joints
                this.leaves.forEach(leaf => {
                    const targetJointIdx = Math.floor(leaf.t * this.segmentCount);
                    if (targetJointIdx < this.joints.length && this.currentStemLength > this.targetHeight * leaf.t) {
                        const j = this.joints[targetJointIdx];
                        ctx.save();
                        ctx.translate(j.x, j.y);
                        const swayAngle = (j.vx * 0.1) + (leaf.side * 0.7);
                        ctx.rotate(swayAngle);

                        ctx.beginPath();
                        ctx.ellipse(leaf.side * leaf.size, 0, leaf.size, leaf.size * 0.45, 0, 0, Math.PI * 2);
                        ctx.fillStyle = this.variety.leafColor;
                        ctx.globalAlpha = 0.85;
                        ctx.fill();
                        ctx.restore();
                    }
                });

                // Draw Flower Head
                if (this.bloomProgress > 0) {
                    ctx.save();
                    ctx.translate(tip.x, tip.y);
                    const tipJoint = this.joints[this.segmentCount];
                    ctx.rotate(this.rotation + tipJoint.vx * 0.05);

                    // Petals
                    const numPetals = this.petals;
                    const angleStep = (Math.PI * 2) / numPetals;

                    for (let i = 0; i < numPetals; i++) {
                        const pAngle = i * angleStep;
                        ctx.save();
                        ctx.rotate(pAngle);

                        ctx.fillStyle = (i % 2 === 0) ? this.primaryColor : this.secondaryColor;
                        ctx.shadowColor = this.primaryColor;
                        ctx.shadowBlur = 10;

                        this.drawPetalShape(ctx, this.variety.petalShape, this.currentRadius);

                        ctx.restore();
                    }

                    // Center Flower Core
                    ctx.beginPath();
                    ctx.arc(0, 0, this.currentRadius * 0.28, 0, Math.PI * 2);
                    ctx.fillStyle = this.variety.centerColor;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 12;
                    ctx.fill();

                    ctx.restore();
                }

                ctx.restore();
            }

            drawPetalShape(ctx, shape, r) {
                ctx.beginPath();
                if (shape === 'heart') {
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-r * 0.5, -r * 0.6, -r * 0.6, -r * 1.25, 0, -r * 1.35);
                    ctx.bezierCurveTo(r * 0.6, -r * 1.25, r * 0.5, -r * 0.6, 0, 0);
                } else if (shape === 'pointed') {
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-r * 0.4, -r * 0.7, 0, -r * 1.45);
                    ctx.quadraticCurveTo(r * 0.4, -r * 0.7, 0, 0);
                } else if (shape === 'ray') {
                    ctx.moveTo(-r * 0.16, 0);
                    ctx.lineTo(-r * 0.16, -r * 1.25);
                    ctx.lineTo(0, -r * 1.4);
                    ctx.lineTo(r * 0.16, -r * 1.25);
                    ctx.lineTo(r * 0.16, 0);
                } else if (shape === 'layered') {
                    ctx.moveTo(0, 0);
                    ctx.ellipse(0, -r * 0.7, r * 0.38, r * 0.7, 0, 0, Math.PI * 2);
                } else { // rounded default
                    ctx.moveTo(0, 0);
                    ctx.arc(0, -r * 0.6, r * 0.42, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

        class PetalParticle {
            constructor(x, y, pollenColor, type = 'pollen', petalColor = '#f472b6') {
                this.x = x;
                this.y = y;
                this.type = type; // 'pollen' or 'petal'
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = type === 'petal' ? (0.2 + Math.random() * 0.8) : (-0.4 - Math.random() * 0.8);
                this.size = type === 'petal' ? (3 + Math.random() * 5) : (1.5 + Math.random() * 2.5);
                this.color = type === 'petal' ? petalColor : pollenColor;
                this.alpha = 1.0;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.decay = 0.006 + Math.random() * 0.01;
            }

            update(mouseObj, windX) {
                this.x += this.vx + windX * 0.8;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
                this.alpha -= this.decay;

                if (interactionMode === 'vortex' && mouseObj.active) {
                    const dx = mouseObj.x - this.x;
                    const dy = mouseObj.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 200) {
                        this.vx += (dx / dist) * 0.2;
                        this.vy += (dy / dist) * 0.2;
                    }
                }
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;

                if (this.type === 'petal') {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initCanvas() {
            canvas = document.getElementById('flowerCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            spawnInitialGarden();
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        function spawnInitialGarden() {
            flowers = [];
            const count = Math.floor(width / 85);
            for (let i = 0; i < count; i++) {
                const x = (width / count) * i + Math.random() * 35;
                const y = height + 10;
                flowers.push(new MultiJointFlower(x, y, currentVariety));
            }
        }

        function setupEventListeners() {
            // Pointer listeners
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('mousedown', (e) => {
                mouse.isDown = true;
                handlePointerMove(e);
                triggerTouchBloom(mouse.x, mouse.y);
            });
            window.addEventListener('mouseup', () => { mouse.isDown = false; });

            // Touch support
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) handlePointerMove(e.touches[0]);
            }, { passive: false });

            canvas.addEventListener('touchstart', (e) => {
                mouse.isDown = true;
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0]);
                    triggerTouchBloom(mouse.x, mouse.y);
                }
            });
            canvas.addEventListener('touchend', () => { mouse.isDown = false; });
        }

        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            if (mouse.x === -1000) {
                mouse.x = currentX;
                mouse.y = currentY;
            }

            mouse.vx = currentX - mouse.x;
            mouse.vy = currentY - mouse.y;
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;
            mouse.x = currentX;
            mouse.y = currentY;
            mouse.active = true;

            // Hide Toast
            const hint = document.getElementById('interactionHint');
            if (hint && !hint.classList.contains('opacity-0')) {
                hint.classList.add('opacity-0', 'translate-y-4');
            }

            const speed = Math.hypot(mouse.vx, mouse.vy);

            if (interactionMode === 'plant' && speed > 2.5) {
                if (Math.random() < 0.28) {
                    const groundY = Math.min(height + 10, mouse.y + 110 + Math.random() * 70);
                    flowers.push(new MultiJointFlower(mouse.x, groundY, currentVariety, {
                        targetHeight: Math.max(70, groundY - mouse.y + Math.random() * 50)
                    }));
                }
            } else if (interactionMode === 'sunlight') {
                flowers.forEach(f => {
                    const tip = f.getTipPosition();
                    const dist = Math.hypot(tip.x - mouse.x, tip.y - mouse.y);
                    if (dist < 130) {
                        f.maxRadius = Math.min(65 * globalScale, f.maxRadius + 0.9);
                        f.bloomProgress = Math.min(1, f.bloomProgress + 0.06);
                    }
                });
            }
        }

        function triggerTouchBloom(x, y) {
            for (let i = 0; i < 3; i++) {
                const offsetX = (Math.random() - 0.5) * 60;
                const groundY = Math.min(height + 10, y + 90 + Math.random() * 50);
                flowers.push(new MultiJointFlower(x + offsetX, groundY, currentVariety, {
                    targetHeight: Math.max(60, groundY - y + (Math.random() - 0.5) * 35)
                }));
            }
        }

        function animate() {
            // Dark gradient backdrop with motion blur
            ctx.fillStyle = 'rgba(6, 9, 19, 0.28)';
            ctx.fillRect(0, 0, width, height);

            const windForceX = mouse.vx * 0.08;
            mouse.vx *= 0.91;
            mouse.vy *= 0.91;

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(mouse, windForceX);
                p.draw(ctx);
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update & Render Flowers
            let fullyGrownCount = 0;
            flowers.forEach(flower => {
                flower.update(mouse, windForceX);
                flower.draw(ctx);
                if (flower.isFullyGrown) fullyGrownCount++;
            });

            // UI Counter
            document.getElementById('activeCountDisplay').innerText = `${flowers.length} 朵盛開中`;

            // Canvas performance limiter
            if (flowers.length > 85) {
                flowers.shift();
            }

            requestAnimationFrame(animate);
        }

        function renderVarietyButtons() {
            const container = document.getElementById('flowerVarietyContainer');
            container.innerHTML = Object.values(FLOWER_VARIETIES).map(v => `
                <button onclick="selectVariety('${v.id}')" class="p-2.5 rounded-2xl border text-xs font-semibold flex items-center gap-2 transition ${v.id === currentVariety.id ? 'bg-pink-600/30 border-pink-500 text-white' : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'}">
                    <span class="text-base">${v.icon}</span>
                    <span class="truncate">${v.name}</span>
                </button>
            `).join('');
        }

        function selectVariety(id) {
            if (FLOWER_VARIETIES[id]) {
                currentVariety = FLOWER_VARIETIES[id];
                document.getElementById('selectedVarietyName').innerText = currentVariety.name;
                renderVarietyButtons();
                playChimeSound(720);
            }
        }

        function setInteractionMode(mode) {
            interactionMode = mode;
            ['Plant', 'Breeze', 'Sun', 'Vortex'].forEach(m => {
                const btn = document.getElementById(`mode${m}Btn`);
                if (m.toLowerCase() === mode || (m === 'Sun' && mode === 'sunlight')) {
                    btn.className = 'py-2 px-1 rounded-xl font-medium transition bg-pink-600 text-white shadow-md flex items-center justify-center gap-1';
                } else {
                    btn.className = 'py-2 px-1 rounded-xl font-medium transition text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1';
                }
            });
        }

        function updateControls() {
            globalScale = parseFloat(document.getElementById('scaleSlider').value);
            document.getElementById('scaleValText').innerText = `${globalScale.toFixed(1)}x`;

            windFactor = parseFloat(document.getElementById('windSlider').value);
            const windLabel = windFactor < 0.8 ? '弱' : windFactor < 1.8 ? '高' : '強風';
            document.getElementById('windValText').innerText = `${windLabel} (${windFactor.toFixed(1)})`;

            pollenDensityLevel = parseInt(document.getElementById('pollenSlider').value, 10);
            const pText = ['關閉', '豐富', '極高'][pollenDensityLevel];
            document.getElementById('pollenValText').innerText = pText;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarPanel');
            const isOpen = !sidebar.classList.contains('pointer-events-none');

            if (isOpen) {
                sidebar.classList.add('translate-x-[360px]', 'opacity-0', 'pointer-events-none');
            } else {
                sidebar.classList.remove('translate-x-[360px]', 'opacity-0', 'pointer-events-none');
            }
        }

        function clearGarden() {
            flowers = [];
            particles = [];
        }

        function triggerBloomBurst() {
            for (let i = 0; i < 18; i++) {
                const rx = Math.random() * width;
                const ry = height + 10;
                const randomVarKeys = Object.keys(FLOWER_VARIETIES);
                const randVar = FLOWER_VARIETIES[randomVarKeys[Math.floor(Math.random() * randomVarKeys.length)]];
                flowers.push(new MultiJointFlower(rx, ry, randVar, {
                    targetHeight: (110 + Math.random() * 190) * globalScale
                }));
            }
            playChimeSound(880);
        }

        function takeSnapshot() {
            const link = document.createElement('a');
            link.download = `dynamic-floral-art-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            setupEventListeners();
            renderVarietyButtons();
            animate();
        });
    </script>
</body>
</html>
